<script>
  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function generateSignedUrl(filename) {
    const secret = "your-secret-token";
    const exp = Math.floor(Date.now() / 1000) + 600;
    const token = await sha256(filename + exp + secret);
    const baseUrl = "https://my-movie-worker-production.jimmykors871.workers.dev/";
    return `${baseUrl}/${filename}?token=${token}&exp=${exp}`;
  }

  function getMovieFromQuery() {
    const params = new URLSearchParams(window.location.search);
    return params.get('movie') || 'session9.m3u8';
  }

  const player = videojs('my-video');

  player.ready(async function () {
    const movieFile = getMovieFromQuery();
    const url = await generateSignedUrl(movieFile);

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(player.tech_.el_);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        player.play().catch(e => console.warn("Autoplay failed:", e));
      });
    } else if (player.tech_.el_.canPlayType('application/vnd.apple.mpegurl')) {
      player.src({ src: url, type: 'application/x-mpegURL' });
      player.play().catch(e => console.warn("Autoplay failed:", e));
    }
  });
</script>
