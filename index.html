<!DOCTYPE html>
<html>
<head>
  <title>Session 9 Streaming</title>
  <link href="https://unpkg.com/video.js/dist/video-js.css" rel="stylesheet" />
</head>
<body>
  <video
    id="my-video"
    class="video-js vjs-default-skin"
    controls
    preload="auto"
    width="640"
    height="360"
    data-setup="{}"
  ></video>

  <script src="https://unpkg.com/video.js/dist/video.min.js"></script>

  <script>
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function generateSignedUrl(filename) {
      const secret = "your-secret-token"; // เปลี่ยนให้ตรงกับฝั่ง Worker
      const exp = Math.floor(Date.now() / 1000) + 600;
      const token = await sha256(filename + exp + secret);
      const baseUrl = "https://my-movie-worker-production.napatsuksin.workers.dev";
      return `${baseUrl}/${filename}?token=${token}&exp=${exp}`;
    }

    const player = videojs('my-video');
    player.ready(async function () {
      const url = await generateSignedUrl('session9.m3u8');
      player.src({ src: url, type: 'application/x-mpegURL' });
      player.play().catch(err => console.warn("Autoplay failed:", err));
    });
  </script>
</body>
</html>
